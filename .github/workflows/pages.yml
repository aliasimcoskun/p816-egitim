# site/ klasörünü GitHub Pages'te yayınlar: https://aliasimcoskun.github.io/p816-carrier-procedures-tr/
# Site önceden derlenmiş olarak depodadır (araclar/derle.py); burada yalnızca yayınlanır.
name: Siteyi yayınla

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: dagitim
        uses: actions/deploy-pages@v4
